name: databases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mysql:
    runs-on: ubuntu-latest
    name: reset strategies on MySQL 8

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: demo_mode
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql
          coverage: none

      - run: composer update --prefer-dist --no-interaction

      - name: Execute database tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: demo_mode
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: vendor/bin/pest --group=database

  pgsql:
    runs-on: ubuntu-latest
    name: reset strategies on PostgreSQL 16

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: demo_mode
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready --health-interval=10s
          --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_pgsql
          coverage: none

      - run: composer update --prefer-dist --no-interaction

      - name: Execute database tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: demo_mode
          DB_USERNAME: postgres
          DB_PASSWORD: password
        run: vendor/bin/pest --group=database
