name: fix code style

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Fix code style
        uses: aglipanci/laravel-pint-action@latest

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Fix code style'
